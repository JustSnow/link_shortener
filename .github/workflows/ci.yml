name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install project and dev dependencies
        run: |
          pip install .
          pip install pytest pytest-asyncio httpx ruff pytest-cov

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run tests with coverage
        run: |
          pytest --cov=app --cov-report=xml --cov-fail-under=80

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      # Optional Docker build & push (enable when needed)
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        run: |
          # 1. Construct the raw image path
          RAW_IMAGE="ghcr.io/${{ github.repository_owner }}/${{ github.repository }}:latest"

          # 2. Convert the entire string to lowercase
          IMAGE=$(echo "$RAW_IMAGE" | tr '[:upper:]' '[:lower:]')

          # 3. Run Docker commands using the lowercase variable
          docker build -t $IMAGE --build-arg GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} .
          docker push $IMAGE
